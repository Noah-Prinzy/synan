<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Your pass, your agenda and the venue's updates." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%BRAND_NAME%</title>
    <!-- Theme before first paint: System (default) / Light / Dark, remembered per device.
         Mirrors packages/ui/src/theme (key, attributes, chrome colours); follows the system
         setting and other tabs live. -->
    <script>
      (function(){var d=document.documentElement,k="synan.theme",q=matchMedia("(prefers-color-scheme: light)");function a(){var c;try{c=localStorage.getItem(k)}catch(e){}var t=c==="light"||c==="dark"?c:q.matches?"light":"dark";d.setAttribute("data-theme",t);d.classList.toggle("dark",t==="dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f7f5f0":"#0a0a0a");m=document.querySelector('meta[name="color-scheme"]');if(m)m.setAttribute("content",t)}a();q.addEventListener("change",a);addEventListener("storage",function(e){if(e.key===k||e.key===null)a()})})();
    </script>
    <!-- The ground before any CSS arrives: no flash on a slow connection. -->
    <style>
      html,body{margin:0}html{background-color:var(--background,#0a0a0a);color-scheme:dark}
      html[data-theme=light]{background-color:var(--background,#f7f5f0);color-scheme:light}
    </style>
  </head>
  <body>
    <!-- First paint before any script: the page frame and header, drawn exactly as the app
         draws them (components/site-header.tsx). main.tsx removes it the moment the app's
         own header is on screen, in the same frame, so nothing jumps. -->
    <div id="boot" aria-hidden="true" class="mx-auto w-full max-w-360 text-foreground md:border-x md:border-border">
      <div class="border-b border-border bg-background">
        <div class="flex h-14 items-stretch md:h-16">
          <span class="flex items-center px-4 text-21 sm:px-6 md:px-8 md:text-28"><!--brand-wordmark--></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
