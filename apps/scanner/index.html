<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: drawn edge to edge, safe areas padded in the shell.
         interactive-widget=resizes-content: the on-screen keyboard shrinks the layout on
         Android, so the manual-entry sheet rides above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Gate" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>%BRAND_SURFACE_NAME%</title>
    <!-- Theme before first paint: System (default) / Light / Dark, remembered per device.
         Mirrors packages/ui/src/theme (key, attributes, chrome colours); follows the system
         setting and other tabs live. -->
    <script>
      (function(){var d=document.documentElement,k="synan.theme",q=matchMedia("(prefers-color-scheme: light)");function a(){var c;try{c=localStorage.getItem(k)}catch(e){}var t=c==="light"||c==="dark"?c:q.matches?"light":"dark";d.setAttribute("data-theme",t);d.classList.toggle("dark",t==="dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="light"?"#f7f5f0":"#0a0a0a");m=document.querySelector('meta[name="color-scheme"]');if(m)m.setAttribute("content",t)}a();q.addEventListener("change",a);addEventListener("storage",function(e){if(e.key===k||e.key===null)a()})})();
    </script>
    <!-- The splash's colours before any CSS arrives (brand/fit.ts BRAND_COLOURS, per theme). -->
    <style>
      html{--boot-ground:#0a0a0a;--boot-ink:#fafafa;--boot-accent:#8ab4ff;color-scheme:dark}
      html[data-theme=light]{--boot-ground:#f7f5f0;--boot-ink:#121110;--boot-accent:#2f62d9;color-scheme:light}
      html,body{margin:0;background:var(--background,var(--boot-ground))}
    </style>
  </head>
  <body>
    <!-- Splash: the mark, shown until the app mounts. Generated from packages/ui/src/brand/fit.ts. -->
    <div id="root"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--boot-ground)" aria-label="Loading %BRAND_SURFACE_NAME%"><svg viewBox="0 0 32 32" width="96" height="96" aria-hidden="true"><path d="M4 4H16A6.65 6.65 0 0 0 16 17.3A4.05 4.05 0 0 1 16 25.4H4Z" style="fill:var(--boot-ink)"/><path d="M28 6.6H16A4.05 4.05 0 0 0 16 14.7A6.65 6.65 0 0 1 16 28H28Z" style="fill:var(--boot-accent)"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
