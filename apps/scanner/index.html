<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: drawn edge to edge, safe areas padded in the shell.
         interactive-widget=resizes-content: the on-screen keyboard shrinks the layout on
         Android, so the manual-entry sheet rides above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Gate" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>%BRAND_SURFACE_NAME%</title>
    <style>
      html,body{margin:0;background:#0a0a0a;color-scheme:dark}
    </style>
  </head>
  <body>
    <!-- Splash: the mark, shown until the app mounts. Generated from packages/ui/src/brand/fit.ts. -->
    <div id="root"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a" aria-label="Loading %BRAND_SURFACE_NAME%"><svg viewBox="0 0 32 32" width="96" height="96" aria-hidden="true"><path d="M4 4H16A6.65 6.65 0 0 0 16 17.3A4.05 4.05 0 0 1 16 25.4H4Z" fill="#FAFAFA"/><path d="M28 6.6H16A4.05 4.05 0 0 0 16 14.7A6.65 6.65 0 0 1 16 28H28Z" fill="#8AB4FF"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
